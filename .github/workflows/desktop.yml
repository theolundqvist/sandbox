name: Desktop app

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      e2e-only:
        description: Run desktop behavior checks without packaging releases
        type: boolean
        default: false
      tests:
        description: Test name pattern (empty runs every desktop group)
        type: string
        default: ""

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Verify sandbox on the runner
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/box-home" "$RUNNER_TEMP/box-tmp"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/box-home" TMPDIR="$RUNNER_TEMP/box-tmp" \
            nice -n 19 timeout --signal=KILL 60s bun --no-env-file test engine/box/box.test.ts
      - run: bun install --frozen-lockfile
      - run: bunx playwright-core install --with-deps chromium
      - name: Install native stack debugger
        run: sudo apt-get install -y --no-install-recommends gdb
      - run: nice -n 19 xvfb-run -a node --test --test-name-pattern="$TEST_PATTERN" app.test.mjs
        timeout-minutes: ${{ inputs.tests && 3 || 25 }}
        env:
          SANDBOX_CAPTURES: ${{ runner.temp }}/captures
          TEST_PATTERN: ${{ inputs.tests || '.*' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-captures
          path: ${{ runner.temp }}/captures

  build:
    # Builds only what ships: tags, or a run by hand.
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')) && !inputs.e2e-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac zip --arm64
          - os: macos-15-intel
            target: --mac zip --x64
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win zip --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: ./stage-engine
      - run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] && set -- "-c.extraMetadata.version=${GITHUB_REF_NAME#v}"
          bunx electron-builder ${{ matrix.target }} --publish never "$@"
      - name: Host a world with the packaged engine
        run: ./smoke "$(ls -d dist/*/resources/engine dist/*/Sandbox.app/Contents/Resources/engine 2>/dev/null | head -1)"
      - name: Install, then update, with install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8123', '--directory', 'dist' -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $env:SANDBOX_RELEASE = 'http://127.0.0.1:8123'
          Get-Content install.ps1 -Raw | Invoke-Expression
          Get-Process Sandbox | Stop-Process
          Get-Content install.ps1 -Raw | Invoke-Expression
          foreach ($file in "$env:LOCALAPPDATA\Programs\Sandbox\Sandbox.exe", "$env:LOCALAPPDATA\Programs\Sandbox\resources\engine\bun.exe", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Sandbox.lnk") {
            if (-not (Test-Path $file)) { throw "Missing $file" }
          }
          Get-Process Sandbox | Stop-Process
          Stop-Process $server
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/Sandbox-*.zip
            desktop/dist/Sandbox-*.AppImage

  engine-windows:
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')) && !inputs.e2e-only
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Verify trusted seeds and unsupported-platform refusal
        run: bun test engine/box/seed.test.ts

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sandbox-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp desktop/build/icon.png dist/sandbox.png
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Sandbox $GITHUB_REF_NAME" --notes "Install or update on a Mac or Linux: curl -fsSL https://raw.githubusercontent.com/theolundqvist/sandbox/master/desktop/install | bash. On Windows, in PowerShell: irm https://raw.githubusercontent.com/theolundqvist/sandbox/master/desktop/install.ps1 | iex"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
