<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Host controls</title>
<style>
  /* The game menu's own look for these controls (index.html over front.css), here on the main menu's origin where the game's page can't reach them. This frame is narrower than the screen, so the game says when its screen is narrow. */
  @font-face { font-family: "Archivo Expanded"; src: url(/fonts/archivo-expanded.woff2) format("woff2"); font-weight: 600 900; font-display: swap; }
  :root { --text: #f3f1ec; --dim: #8f8c86; --faint: rgba(243,241,236,.5); --line: rgba(255,255,255,.1); --accent: #ffb547; --err: #ff6b5b; --display: "Archivo Expanded", "Helvetica Neue", Arial, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: transparent; color: var(--text); font: 14px/1.4 "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif; }
  [hidden] { display: none !important; }
  button { font-family: inherit; font-weight: 700; font-size: 12px; line-height: 1; letter-spacing: .14em; text-transform: uppercase; color: var(--text); background: transparent; border: 1px solid rgba(255,255,255,.28); border-radius: 2px; padding: 11px 16px; cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--text); color: #0b0b0c; border-color: var(--text); }
  button:disabled { opacity: .45; pointer-events: none; }
  code { display: block; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #d9d6cf; word-break: break-all; }
  .gap { height: 32px; flex: none; }
  .field { display: flex; align-items: center; gap: 24px; width: 100%; min-height: 64px; padding: 0 0 0 32px; position: relative; border-bottom: 1px solid var(--line); }
  .field::before { content: ""; position: absolute; left: 0; top: 50%; width: 14px; height: 14px; translate: 0 -50%; background: var(--accent); scale: 0; transition: scale .12s ease-out; }
  .field:focus-within::before { scale: 1; }
  .field > span:first-child { flex: 1; min-width: 0; font: 700 20px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .field:focus-within > span:first-child { color: var(--text); }
  .field input[type=password] { width: 220px; background: none; border: 0; border-bottom: 1px solid rgba(255,255,255,.28); color: var(--text); font: 15px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 6px 0; outline: none; }
  .field input[type=password]:focus { border-color: var(--accent); }
  .field input[type=text] { width: 60%; background: none; border: 0; border-radius: 0; color: var(--text); font: 700 24px/1.2 var(--display); padding: 12px 0; text-align: right; outline: none; }
  .field input[type=text]::placeholder { color: rgba(255,255,255,.3); }
  .pick { display: flex; align-items: center; gap: 4px; outline: none; font: 800 18px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; }
  .pick output { min-width: 140px; text-align: center; }
  .pick i { font-style: normal; color: var(--dim); padding: 8px 10px; cursor: pointer; user-select: none; }
  .pick i:hover { color: var(--accent); }
  .item { position: relative; display: flex; align-items: baseline; gap: 20px; margin: 0; padding: 8px 0 8px 32px; background: none; border: 0; border-radius: 0; color: var(--faint); font: 800 34px/1.1 var(--display); letter-spacing: .03em; text-transform: uppercase; text-align: left; cursor: pointer; outline: none; white-space: nowrap; }
  .item::before { content: ""; position: absolute; left: 0; top: 50%; width: 14px; height: 14px; translate: 0 -50%; background: var(--accent); scale: 0; transition: scale .12s ease-out; }
  .item:hover { background: none; color: var(--faint); }
  .item:focus-visible, .item:focus { color: var(--text); background: none; }
  .item:focus::before { scale: 1; }
  #share-shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 6px; margin: 8px 0 0; }
  #share-shots button { position: relative; display: block; width: 100%; padding: 0; margin: 0; aspect-ratio: 16 / 9; background: #1b1c1f; border: 2px solid transparent; }
  #share-shots button:hover, #share-shots button:focus-visible { border-color: rgba(255,255,255,.4); }
  #share-shots button[data-n] { border-color: var(--accent); }
  #share-shots button[data-n]::after { content: attr(data-n); position: absolute; left: 0; top: 0; padding: 3px 6px; background: var(--accent); color: #111; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  #share-shots img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .copy-row { display: flex; align-items: center; gap: 16px; width: 100%; max-width: 100%; min-height: 56px; border-bottom: 1px solid var(--line); }
  .copy-row > span { width: 150px; flex: none; color: var(--dim); font: 700 12px/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; }
  .copy-row code { flex: 1; min-width: 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #d9d6cf; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .copy-row button { flex: none; background: none; border: 0; padding: 10px 4px; color: var(--dim); font: 700 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; outline: none; }
  .copy-row button:hover, .copy-row button:focus { color: var(--text); background: none; }
  .copy-row button.danger:hover, .copy-row button.danger:focus { color: var(--err); }
  .note { margin: 20px 0 0; color: var(--dim); font-size: 13px; }
  #voice-where { margin: 12px 0 16px; }
  #voice-where a { color: var(--text); }
  .narrow .field { padding-left: 26px; gap: 12px; }
  .narrow .field > span:first-child { font-size: 15px; }
  .narrow .copy-row > span { width: 88px; }
  .narrow .field input[type=text] { font-size: 18px; }
  .narrow .pick output { min-width: 96px; font-size: 14px; }
  .narrow .item { font-size: 26px; padding-left: 26px; }
  @media (prefers-reduced-motion: reduce) { .field::before, .item::before { transition: none; } }
</style>
</head>
<body>
<section data-view="world" data-nav hidden>
  <div class="copy-row"><button id="world-share">Share</button><button id="world-export">Export</button></div>
  <div class="copy-row"><button id="world-stop" class="danger">Stop hosting</button></div>
  <div class="gap"></div>
  <div id="world-snapshots"></div>
  <p class="note" id="world-voice" hidden></p>
</section>
<section data-view="share" data-nav hidden>
  <label class="field"><span>Title</span><input type="text" id="share-title" maxlength="60" autocomplete="off" spellcheck="false"></label>
  <label class="field"><span>About</span><input type="text" id="share-description" maxlength="200" placeholder="One line" autocomplete="off"></label>
  <label class="field" id="share-changes-field" hidden><span>What changed</span><input type="text" id="share-changes" maxlength="280" autocomplete="off"></label>
  <div class="field"><span>Who sees it</span><div class="pick" id="share-visibility" data-options="link:Link only,public:Everyone"></div></div>
  <p class="note" id="share-names" hidden>Player names in scores and items are shared with the world.</p>
  <div class="field"><span>Timelapse</span><div class="pick" id="share-timelapse" data-options="on:On its page,off:Off"></div></div>
  <div class="field"><span>Pictures</span><button id="share-moments">Take from the timelapse</button></div>
  <p class="note" id="share-pick-note"></p>
  <div id="share-shots"></div>
  <div class="copy-row" id="share-shared" hidden><span>Link</span><code id="share-link"></code><button id="share-copy">Copy</button><button id="share-stop" class="danger">Stop sharing</button></div>
  <div class="gap"></div>
  <button id="share-go" class="item">Share</button>
  <p class="note" id="share-status"></p>
</section>
<section data-view="voice" data-nav hidden>
  <label class="field" id="voice-field"><span>Voice key</span><input type="password" id="voice-key" autocomplete="off" spellcheck="false"></label>
  <p class="note" id="voice-where"></p>
</section>
<script type="module">
  // The host's controls inside their own game: on the main menu's origin, framed only by the game at localhost, whose page and mods can't read in here.
  // The game may ask for exactly five things, each about the world running now: join it as the host, take a picture of it, stage one of its mods for the app to publish, show or focus these controls, and fill in Share's About.
  // Stopping, exporting, rewinding, sharing, stopping sharing and the speech key happen only from the buttons here. Share asks the game for what only it can make: its view, moments of its timelapse and a clip of it, and the app's dialog that publishes through the player's account; everything else it sends is typed or picked here.
  // What goes back out is a toast, a size, whether this frame has drawn, the host's own player key, whether this is their world, and these requests.
  import { pick } from "/front.js";
  const $ = (id) => document.getElementById(id);
  const query = new URLSearchParams(location.search);
  const view = query.get("view");
  const game = `http://localhost:${location.port}`;
  const tell = (msg) => parent.postMessage({ host: view, ...msg }, game);
  const section = document.querySelector(`section[data-view="${CSS.escape(view ?? "")}"]`);
  // At once, so the game waits for what follows rather than taking this for a page without controls.
  tell({ t: "hello" });

  const key = parent !== window && section ? await fetch("/api/local-key").then((r) => (r.ok ? r.json() : {})).then((r) => r.key ?? null, () => null) : null;
  const api = (action, body) => fetch(`/api/menu/${action}`, { method: body ? "POST" : "GET", headers: { authorization: `Bearer ${key}` }, body: body && JSON.stringify(body) });
  const state = key ? await api("state").then((r) => (r.ok ? r.json() : null), () => null) : null;
  /** The world these controls act on: the one running as they opened, and only when it is the one the game around them shows. */
  const bound = state?.running && state.running.id === query.get("world") ? state.running.id : null;
  const toast = (text, kind = "info") => tell({ t: "toast", text, kind });

  if (!bound) tell({ t: "ready", hosting: false });
  else {
    section.hidden = false;
    new ResizeObserver(() => tell({ t: "size", height: document.body.getBoundingClientRect().height })).observe(document.body);
    // The game shows these controls only while they keep saying so from here, so a page it navigates this frame to never passes for them.
    setInterval(() => tell({ t: "beat" }), 500);
    addEventListener("pagehide", () => tell({ t: "gone" }));
    // A frame the game hid is throttled and keeps its old drawing; a click before it draws again goes nowhere. Each time the game shows it, it says when it has drawn twice since.
    const paint = (id) => {
      tell({ t: "beat" });
      requestAnimationFrame(() => requestAnimationFrame(() => tell({ t: "painted", id })));
    };
    addEventListener("keydown", (e) => {
      const field = document.activeElement?.matches("input, textarea, select, .pick");
      if (e.code !== "Escape" && e.code !== "Tab" && !(e.code === "ArrowLeft" && !field)) return;
      e.preventDefault();
      tell({ t: "key", code: e.code });
    });
    const focusFirst = () => document.activeElement === document.body && section.querySelector("button, input")?.focus();
    addEventListener("focus", focusFirst);

    /** The game's last view arriving before Stop goes ahead, while the world still runs to take it. */
    let lastView = null;
    /** Share's requests to the game, by id: its answer, or null once their time is up. */
    const asked = new Map();
    let seq = 0;
    const askGame = (t, ms) =>
      new Promise((resolve) => {
        const id = ++seq;
        const timer = setTimeout(() => asked.get(id)?.(null), ms);
        asked.set(id, (msg) => {
          clearTimeout(timer);
          asked.delete(id);
          resolve(msg);
        });
        tell({ t, id });
      });
    /** Share's page, set up below for that frame only, once the game opens it. */
    let showShare = null;
    const base64 = (bytes) =>
      new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1]);
        reader.readAsDataURL(new Blob([bytes]));
      });
    const failed = async (res) => (res?.ok ? "" : ((await res?.json().catch(() => null))?.error ?? "Community didn't answer. Try again."));
    const isJpeg = (bytes) => bytes instanceof Uint8Array && bytes.length <= 2 << 20 && bytes[0] === 0xff && bytes[1] === 0xd8;
    async function cover(msg) {
      const jpeg = isJpeg(msg.jpeg) ? msg.jpeg : null;
      if (!jpeg) return tell({ t: "covered", id: Number(msg.id), ok: false });
      // A keepalive request, up to the 64 KB one carries, outlives the game's page as it closes.
      const res = await fetch(`/api/menu/cover?id=${encodeURIComponent(bound)}`, { method: "POST", keepalive: jpeg.length <= 65_536, headers: { authorization: `Bearer ${key}` }, body: jpeg }).catch(() => null);
      lastView?.();
      tell({ t: "covered", id: Number(msg.id), ok: !!res?.ok });
    }
    async function join(msg) {
      const body = typeof msg.key === "string" ? { id: bound, key: msg.key } : { id: bound, name: String(msg.name ?? ""), password: typeof msg.password === "string" ? msg.password : undefined };
      const res = await api("join", body).catch(() => null);
      const data = (await res?.json().catch(() => null)) ?? {};
      const id = Number(msg.id);
      tell(res?.ok ? { t: "joined", id, key: String(data.key), name: String(data.name) } : { t: "joined", id, error: String(data.error ?? "The host's controls didn't answer. Try again."), password: !!data.password });
    }
    /** A shared mod's preview and words, from the game's Mods page; the app publishes it only once the player confirms in its own dialog. */
    async function stageMod(msg) {
      const res = isJpeg(msg.jpeg) ? await api("mod-stage", { id: bound, name: String(msg.name ?? ""), title: String(msg.title ?? "").slice(0, 60), description: String(msg.description ?? "").slice(0, 200), cover: await base64(msg.jpeg) }).catch(() => null) : null;
      tell({ t: "staged", id: Number(msg.id), error: res?.ok ? null : await failed(res) });
    }

    /** The host's own world: rewind it to a saved moment, export it, or stop hosting it. */
    const time = (at) => new Date(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    async function showWorld() {
      $("world-stop").textContent = "Stop hosting";
      void api("free-voice")
        .then((res) => res.json())
        .then((free) => {
          $("world-voice").hidden = !free;
          if (free) $("world-voice").textContent = `Free voice: $${free.used.toFixed(2)} of $${free.of} used`;
        });
      const s = await (await api("state")).json();
      $("world-snapshots").replaceChildren(
        ...(s.running?.id === bound ? s.running.snapshots : []).map((at) => {
          const rewind = Object.assign(document.createElement("button"), { textContent: "Rewind" });
          rewind.onclick = async () => {
            if (rewind.textContent === "Rewind") return void (rewind.textContent = `Rewind to ${time(at)}?`);
            const res = await api("rewind", { id: bound, at });
            if (!res.ok) toast((await res.json()).error, "error");
          };
          const row = Object.assign(document.createElement("div"), { className: "copy-row" });
          row.append(Object.assign(document.createElement("span"), { textContent: time(at) }), Object.assign(document.createElement("code"), { textContent: "Saved moment" }), rewind);
          return row;
        }),
      );
    }

    addEventListener("message", (e) => {
      if (e.source !== parent || e.origin !== game || typeof e.data !== "object" || !e.data) return;
      const msg = e.data;
      if (msg.t === "layout") document.documentElement.classList.toggle("narrow", !!msg.narrow);
      else if (msg.t === "focus") focusFirst();
      else if (msg.t === "paint") paint(Number(msg.id));
      else if (msg.t === "show" && view === "world") void showWorld();
      else if (msg.t === "show" && view === "share") showShare?.(String(msg.about ?? "").slice(0, 200));
      else if (msg.t === "join" && view === "world") void join(msg);
      else if (msg.t === "cover" && view === "world") void cover(msg);
      else if (msg.t === "mod" && view === "world") void stageMod(msg);
      else if (["view", "moments", "clip", "publish", "unpublish"].includes(msg.t) && view === "share") asked.get(Number(msg.id))?.(msg);
    });

    if (view === "world") {
      $("world-share").onclick = () => tell({ t: "share" });
      $("world-export").onclick = async () => {
        $("world-export").textContent = "Exporting…";
        const res = await api("export", { id: bound });
        $("world-export").textContent = "Export";
        if (!res.ok) return toast((await res.json()).error, "error");
        const link = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await res.blob()), download: res.headers.get("content-disposition")?.match(/filename="(.+)"/)?.[1] ?? "world.zip" });
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 60_000);
      };
      $("world-stop").onclick = async () => {
        if ($("world-stop").textContent === "Stop hosting") return void ($("world-stop").textContent = "Stop for everyone?");
        const last = Promise.withResolvers();
        lastView = last.resolve;
        tell({ t: "stopping" });
        setTimeout(last.resolve, 1500);
        await last.promise;
        await api("stop", { id: bound }).catch(() => null);
        tell({ t: "stopped" });
      };
      void showWorld();
    } else if (view === "share") {
      /** Share: this world to Community through the app's account, as a link for friends or for everyone, with a cover, a gallery and its timelapse. Sharing again updates it. */
      let about = "";
      let busy = false;
      /**
       * The pictures Share can send, as base64 JPEGs, all world-only: the game's view right now, the world's picture and the views its game kept, and moments of its timelapse.
       * The first picked is the cover and up to 8 more make its gallery; a shared world nobody re-picks for keeps the ones Community has.
       */
      let shots = [];
      let picks = [];
      let repicked = false;
      /** The shots as they are now, asking the game for its view again only when `fresh`; an answer that arrives after a newer one is dropped. */
      let loadingShots = 0;
      async function loadShots(fresh) {
        const at = ++loadingShots;
        const kept = api("shots", { id: bound }).then((r) => (r.ok ? r.json() : []), () => []);
        const view = !fresh && shots[0]?.name === "view" ? shots[0].jpeg : await askGame("view", 5000).then((msg) => (isJpeg(msg?.jpeg) ? base64(msg.jpeg) : null));
        const all = [...(view ? [{ name: "view", jpeg: view }] : []), ...(await kept)];
        if (at !== loadingShots) return;
        shots = all;
        picks = picks.filter((p) => shots.some((s) => s.name === p));
        showShots();
      }
      function showShots() {
        $("share-shots").replaceChildren(
          ...shots.map((shot) => {
            const n = picks.indexOf(shot.name);
            const button = Object.assign(document.createElement("button"), { type: "button", title: shot.name === "view" ? "Current view" : shot.name === "cover" ? "World picture" : "" });
            if (n >= 0) button.dataset.n = n ? String(n) : "Cover";
            button.append(Object.assign(document.createElement("img"), { src: `data:image/jpeg;base64,${shot.jpeg}`, alt: "" }));
            button.onclick = () => {
              repicked = true;
              picks = n >= 0 ? picks.filter((p) => p !== shot.name) : picks.length < 9 ? [...picks, shot.name] : picks;
              showShots();
            };
            return button;
          }),
        );
        const shared = $("share-go").textContent === "Update";
        $("share-pick-note").textContent = !picks.length && shared ? "Pick none to keep the pictures it has." : "The first you pick is the cover; up to 8 more go on its page.";
      }
      const jpegOf = (name) => shots.find((s) => s.name === name).jpeg;
      const showNames = (value) => ($("share-names").hidden = value !== "public");
      const visibility = pick($("share-visibility"), showNames);
      const timelapsePick = pick($("share-timelapse"), () => {});
      /** The page as the world is shared now; an About the game offered fills in a world not shared yet. While a share goes up, it says so instead; the picks stay while it does, or once new moments come in. */
      async function open(status = "", keepPicks = false) {
        const s = await api("state").then((r) => (r.ok ? r.json() : null), () => null);
        const w = s?.worlds.find((x) => x.id === bound);
        const shared = w?.shared;
        $("share-title").value = shared?.title ?? w?.name ?? "";
        $("share-description").value = shared?.description ?? about;
        visibility.set(shared?.visibility ?? "link");
        showNames(visibility.dataset.value);
        if (!status && !keepPicks) timelapsePick.set(shared?.timelapse === false ? "off" : "on");
        $("share-shared").hidden = !shared?.link;
        $("share-link").textContent = shared?.link ?? "";
        $("share-stop").textContent = "Stop sharing";
        $("share-go").textContent = shared?.link ? "Update" : "Share";
        $("share-changes-field").hidden = !shared?.link;
        if (!status && !keepPicks) {
          $("share-changes").value = "";
          picks = shared?.link ? [] : [w?.cover ? "cover" : "view"];
          repicked = false;
        }
        $("share-status").textContent = status || "Chat stays on this computer.";
        await loadShots(!status);
      }
      showShare = (offered) => {
        about = offered;
        if (!busy) void open();
      };
      /** Moments of the timelapse, evenly spaced, drawn by the game as its replay shows them, without trails or name tags; they replace the moments drawn before. */
      $("share-moments").onclick = async () => {
        if (busy) return;
        busy = true;
        const jpegs = (await askGame("moments", 120_000))?.jpegs;
        const frames = Array.isArray(jpegs) ? jpegs.filter(isJpeg) : [];
        const res = frames.length ? await api("timelapse-shots", { id: bound, frames: await Promise.all(frames.map(base64)) }).catch(() => null) : null;
        if (frames.length && !res?.ok) toast(await failed(res), "error");
        busy = false;
        await open("", true);
      };
      $("share-go").onclick = async () => {
        if (busy) return;
        // Only the app publishes, as the account signed in there.
        if (!query.has("desktop")) return void (await open("Publish from the Sandbox app."));
        busy = true;
        $("share-go").disabled = true;
        // The world's picture is already its cover, so only another pick replaces it.
        const cover = picks[0] && picks[0] !== "cover" ? jpegOf(picks[0]) : undefined;
        const gallery = repicked ? picks.slice(1).map(jpegOf) : undefined;
        const timelapse = $("share-timelapse").dataset.value !== "off";
        // Bound to the world running as these controls opened.
        const form = { id: bound, title: $("share-title").value, description: $("share-description").value, changelog: $("share-changes").value, visibility: $("share-visibility").dataset.value, cover, gallery, timelapse };
        if (timelapse) $("share-status").textContent = "Recording a clip of the timelapse…";
        const webm = timelapse ? (await askGame("clip", 120_000))?.webm : null;
        $("share-status").textContent = "Uploading…";
        const res = await api("publish-stage", { ...form, clip: webm instanceof Uint8Array ? await base64(webm) : undefined }).catch(() => null);
        // The app asks the player in a dialog no world can draw, then publishes what was staged here.
        const said = res?.ok ? (await askGame("publish", 10 * 60_000))?.said : await failed(res);
        busy = false;
        $("share-go").disabled = false;
        await open(typeof said === "string" ? said : "");
      };
      $("share-stop").onclick = async () => {
        if ($("share-stop").textContent === "Stop sharing") return void ($("share-stop").textContent = "Remove from Community?");
        // A world of the app's account comes down through the app; one shared before accounts, by its owner token here.
        const said = query.has("desktop") ? (await askGame("unpublish", 10 * 60_000))?.said : await failed(await api("unshare", { id: bound }).catch(() => null));
        await open(typeof said === "string" ? said : "");
      };
      $("share-copy").onclick = async () => {
        const code = $("share-link");
        // Plain-http pages have no clipboard API when unfocused.
        if (!(await navigator.clipboard?.writeText(code.textContent).then(() => true, () => false))) {
          getSelection().selectAllChildren(code);
          document.execCommand("copy");
        }
        $("share-copy").textContent = "Copied";
        setTimeout(() => ($("share-copy").textContent = "Copy"), 1500);
      };
    } else {
      /** The host's speech key, kept by their launcher and shown only by its provider and last characters. */
      $("voice-key").placeholder = state.voiceKey ?? "Paste a speech key";
      $("voice-where").replaceChildren(
        "Paste a speech key from ",
        ...state.voiceProviders.flatMap((p, i, all) => [
          i ? (i === all.length - 1 ? " or " : ", ") : "",
          Object.assign(document.createElement("a"), { href: p.keys, target: query.has("desktop") ? "_top" : "_blank", rel: "noreferrer", textContent: p.name }),
          p.free ? " (free)" : "",
        ]),
        ".",
      );
      $("voice-key").onchange = async () => {
        const field = $("voice-key");
        const res = await api("voice", { key: field.value });
        const data = await res.json().catch(() => ({ error: "The voice key wasn't saved. Try again." }));
        if (!res.ok) return toast(data.error, "error");
        field.value = "";
        field.placeholder = data.voiceKey ?? "Paste a speech key";
        toast(data.voiceKey ? "Voice is on" : "Voice is off");
      };
    }
    tell({ t: "ready", hosting: true });
  }
</script>
</body>
</html>
