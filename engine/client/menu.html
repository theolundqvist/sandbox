<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='6' y='6' width='20' height='20' fill='%23ffb547'/></svg>">
<link rel="preload" as="image" href="/clips/poster.jpg">
<link rel="stylesheet" href="/front.css">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #101113; color: var(--text); font: 15px/1.45 system-ui, sans-serif; overflow: hidden; }
  #title .logo { margin-bottom: 64px; }
  /* Long lists scroll above the key hints, never under them. */
  .front { bottom: 96px; padding-bottom: 0; }
  @media (max-width: 760px), (pointer: coarse) { .front { bottom: 0; padding-bottom: 48px; } }
  .status { color: var(--dim); font: 700 14px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; }
  .copy-row b { flex: 1; min-width: 0; font: 700 18px/1.2 var(--display); overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; background: #55524c; flex: none; } .dot.on { background: var(--ok); }
  #app .note { margin: 20px 0 0; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<div id="backdrop" class="backdrop"></div>
<main class="front">
  <button class="back" id="back" hidden>Back<kbd>Esc</kbd></button>
  <section id="title" class="screen" data-nav hidden>
    <svg class="logo" id="logo"></svg>
    <p id="waiting" class="status" hidden>Waiting for the host</p>
    <div class="items">
      <button class="item" id="go-play">Play<span class="value" id="playing"></span></button>
      <button class="item" id="go-invite" data-to="invite">Invite</button>
      <button class="item" id="go-worlds" data-to="worlds">Worlds</button>
      <button class="item" id="go-create" data-to="create">Create</button>
      <button class="item" id="go-app" data-to="app" hidden>Desktop app</button>
    </div>
  </section>

  <section id="worlds" class="screen" data-nav hidden>
    <h1>Worlds</h1>
    <div class="items" id="world-list"></div>
  </section>

  <section id="world" class="screen" data-nav hidden>
    <h1 id="world-name"></h1>
    <div class="items">
      <button class="item" id="world-play"></button>
      <button class="item" id="world-timelapse">Timelapse</button>
      <button class="item" id="world-rewind" data-to="rewind">Rewind</button>
      <button class="item" id="world-settings" data-to="configure">Settings</button>
      <button class="item" id="world-stop">Stop</button>
      <button class="item danger" id="world-delete">Delete</button>
    </div>
  </section>

  <section id="configure" class="screen" data-nav hidden>
    <h1>Settings</h1>
    <label class="field"><span>Name</span><input type="text" id="configure-name" maxlength="40" autocomplete="off" spellcheck="false"></label>
    <div class="field"><span>House rules</span><div class="pick rules" id="configure-rules" data-options="open:Open,additive:Additive"></div></div>
  </section>

  <section id="create" class="screen" data-nav hidden>
    <h1>New world</h1>
    <label class="field"><span>Name</span><input type="text" id="create-name" placeholder="Untitled" maxlength="40" autocomplete="off" spellcheck="false"></label>
    <div class="field"><span>House rules</span><div class="pick rules" id="create-rules" data-options="open:Open,additive:Additive"></div></div>
    <div class="field"><span>Start with</span><div class="pick" id="create-start" data-options="blank:Blank,basics:3D field,hills:3D hills"></div></div>
    <div class="gap"></div>
    <div class="items"><button class="item" id="create-go">Create</button></div>
  </section>

  <section id="invite" class="screen" data-nav hidden>
    <h1>Invite</h1>
    <div class="copy-row"><span>Wi-Fi</span><code id="link-lan"></code><button data-copy="link-lan">Copy</button><button id="new-invite" title="Old links stop working">New link</button></div>
    <div class="copy-row" title="Anyone with the link can join and run code on this computer"><span>Internet</span><div class="pick" id="share" data-options="off:Off,on:On"></div></div>
    <div class="copy-row" id="public" hidden><span>Link</span><code id="link-public"></code><button data-copy="link-public">Copy</button></div>
    <div class="gap"></div>
    <div id="players"></div>
  </section>

  <section id="rewind" class="screen" data-nav hidden>
    <h1>Rewind</h1>
    <div class="items" id="snapshots"></div>
  </section>

  <section id="ask" class="screen" data-nav hidden>
    <h1 id="ask-title"></h1>
    <div class="items"><button class="item danger" id="ask-yes"></button><button class="item" id="ask-no">Cancel</button></div>
  </section>

  <section id="app" class="screen" data-nav hidden>
    <h1>Desktop app</h1>
    <p class="lead">Full screen. Mouse look without interruptions. Right-click works.</p>
    <div class="copy-row"><span>Install</span><code id="app-install"></code><button data-copy="app-install">Copy</button></div>
    <p class="note">Mac and Linux. On Windows, in WSL.</p>
  </section>

  <div id="error" class="error"></div>
</main>
<div class="hints"><span><kbd>↑↓</kbd>Select</span><span><kbd>Enter</kbd>Open</span></div>
<script type="module">
  import { backdrop, logo, pick } from "/front.js";
  const $ = (id) => document.getElementById(id);
  backdrop($("backdrop"));
  logo($("logo"));

  const hashKey = new URLSearchParams(location.hash.slice(1)).get("key");
  if (hashKey) {
    localStorage.setItem("sandbox-menu", hashKey);
    history.replaceState(null, "", "/menu");
  }
  const key = localStorage.getItem("sandbox-menu");
  let state = null;
  let selected = null;

  async function api(action, body) {
    const res = await fetch(`/api/menu/${action}`, { method: body ? "POST" : "GET", headers: { authorization: `Bearer ${key}` }, body: body && JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    render((state = data));
    return data;
  }
  const attempt = (work) => work().catch((e) => ($("error").textContent = e.message));

  // ---------- screens: a stack, Esc goes back one ----------
  const stack = [];
  const current = () => stack.at(-1);
  function show(id, { replace = false } = {}) {
    const from = current();
    if (from) from.focus = document.activeElement?.closest(".screen") === $(from.id) ? document.activeElement : null;
    if (replace) stack.pop();
    stack.push({ id });
    enter();
  }
  function back() {
    if (stack.length < 2) return;
    stack.pop();
    enter();
  }
  function enter() {
    const { id, focus } = current();
    for (const s of document.querySelectorAll(".screen")) s.hidden = s.id !== id;
    $("error").textContent = "";
    $("back").hidden = stack.length < 2;
    const target = focus?.isConnected && !focus.disabled && focus.getClientRects().length ? focus : $(id).querySelector(".item:not([hidden]):not(:disabled), .field input, .pick, .copy-row button");
    target?.focus();
  }
  addEventListener("keydown", (e) => {
    const typing = document.activeElement?.matches("input[type=text]");
    if (e.key === "Escape" || (e.key === "Backspace" && !typing)) {
      e.preventDefault();
      document.activeElement?.blur();
      if (current()?.id === "ask") return answer(false);
      back();
    }
    if (e.key === "Enter" && typing) {
      e.preventDefault();
      document.activeElement.blur();
      if (current()?.id === "create") $("create-go").focus();
    }
  });
  for (const b of document.querySelectorAll("[data-to]")) b.onclick = () => show(b.dataset.to);
  $("back").onclick = () => (current()?.id === "ask" ? answer(false) : back());

  /** A yes-or-no question as its own screen. */
  let answer = () => {};
  function ask(title, yes) {
    $("ask-title").textContent = title;
    $("ask-yes").textContent = yes;
    show("ask");
    return new Promise((resolve) => {
      answer = (ok) => {
        answer = () => {};
        back();
        resolve(ok);
      };
    });
  }
  $("ask-yes").onclick = () => answer(true);
  $("ask-no").onclick = () => answer(false);

  // ---------- state ----------
  const ago = (ms) => {
    const m = Math.round((Date.now() - ms) / 60000);
    return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
  };
  const el = (tag, props, ...children) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  };
  /** Rebuilds a list without losing the control the player is on. */
  function rebuild(list, children) {
    const focused = list.contains(document.activeElement) ? document.activeElement.dataset.key : null;
    list.replaceChildren(...children);
    if (focused) list.querySelector(`[data-key="${CSS.escape(focused)}"]`)?.focus();
  }

  function render(s) {
    const r = s.running;
    $("go-play").hidden = $("go-invite").hidden = !r;
    $("go-worlds").hidden = !s.worlds.length;
    $("playing").textContent = r?.name ?? "";
    rebuild($("world-list"), s.worlds.map((w) => {
      const b = el("button", { className: "item", textContent: w.name }, el("span", { className: r?.id === w.id ? "value live" : "value", textContent: r?.id === w.id ? "Live" : ago(w.played) }));
      b.dataset.key = w.id;
      b.onclick = () => {
        selected = w.id;
        renderWorld();
        show("world");
      };
      return b;
    }));
    if (selected) renderWorld();
    if (r) {
      $("link-lan").textContent = `${s.lan ?? location.origin}/#invite=${r.invite}`;
      $("share").set(s.tunnel ? "on" : "off");
      if (s.tunnelError) $("error").textContent = s.tunnelError;
      $("public").hidden = !s.tunnel;
      $("link-public").textContent = s.tunnel?.url ? `${s.tunnel.url}/#invite=${r.invite}` : "Opening…";
      rebuild($("players"), r.players.map((p) => {
        const link = el("button", { textContent: "Copy link", title: "Their own link back in, from any address" });
        link.dataset.key = `link-${p.name}`;
        link.onclick = async () => {
          await navigator.clipboard.writeText(`${s.tunnel?.url ?? s.lan ?? location.origin}/#key=${p.key}`);
          link.textContent = "Copied";
        };
        const remove = el("button", { className: "danger", textContent: "Remove" });
        remove.dataset.key = `remove-${p.name}`;
        remove.onclick = async () => (await ask(`Remove ${p.name}?`, "Remove")) && attempt(() => api("remove", { name: p.name }));
        return el("div", { className: "copy-row" }, el("i", { className: p.online ? "dot on" : "dot" }), el("b", { textContent: p.name }), link, remove);
      }));
      rebuild($("snapshots"), r.snapshots.map((at) => {
        const time = new Date(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const b = el("button", { className: "item", textContent: time }, el("span", { className: "value", textContent: ago(at) }));
        b.dataset.key = String(at);
        b.onclick = async () => (await ask(`Back to ${time}?`, "Rewind")) && attempt(() => api("rewind", { at }));
        return b;
      }));
    }
    if (!stack.length) show("title");
    else if (!$(current().id).querySelector(":focus")) enter();
  }

  function renderWorld() {
    const w = state.worlds.find((x) => x.id === selected);
    if (!w) {
      selected = null;
      while (stack.length > 1 && ["world", "configure", "rewind"].includes(current().id)) stack.pop();
      return enter();
    }
    const live = state.running?.id === w.id;
    $("world-name").textContent = w.name;
    $("world-play").textContent = live ? "Play" : "Host";
    $("world-rewind").hidden = !live || !state.running.snapshots.length;
    $("world-stop").hidden = !live;
    $("world-settings").hidden = $("world-delete").hidden = live;
    if (document.activeElement !== $("configure-name")) $("configure-name").value = w.name;
    $("configure-rules").set(w.rules);
  }

  const play = (s) => location.assign(`/#invite=${s.running.hostKey}`);
  async function hostWorld(id) {
    if (state.running && state.running.id !== id && !(await ask(`Stop ${state.running.name}?`, "Stop and host"))) return;
    await attempt(async () => play(await api("host", { id })));
  }
  $("go-play").onclick = () => play(state);
  $("world-play").onclick = () => hostWorld(selected);
  /** The timelapse plays from the world's own server, so a world that isn't running is hosted first. */
  $("world-timelapse").onclick = async () => {
    if (state.running && state.running.id !== selected && !(await ask(`Stop ${state.running.name}?`, "Stop and watch"))) return;
    await attempt(async () => {
      const s = state.running?.id === selected ? state : await api("host", { id: selected });
      location.assign(`/#watch=${s.running.hostKey}`);
    });
  };
  $("world-stop").onclick = async () => (await ask(`Stop ${state.running.name}?`, "Stop")) && attempt(() => api("stop", {}));
  $("world-delete").onclick = async () => {
    const w = state.worlds.find((x) => x.id === selected);
    if (await ask(`Delete ${w.name}?`, "Delete")) await attempt(() => api("delete", { id: w.id }));
  };
  const configure = () => attempt(() => api("configure", { id: selected, name: $("configure-name").value, rules: $("configure-rules").dataset.value }));
  pick($("configure-rules"), configure);
  $("configure-name").onchange = configure;

  const rulesTip = "Open: any Claude can change any mod. Additive: Claudes only add, and answer an attack with a counter-mod.";
  for (const p of document.querySelectorAll(".pick.rules")) p.closest(".field").title = rulesTip;
  pick($("create-rules"));
  pick($("create-start"));
  $("create-go").onclick = async () => {
    if (state.running && !(await ask(`Stop ${state.running.name}?`, "Stop and create"))) return;
    await attempt(async () => play(await api("create", { name: $("create-name").value, rules: $("create-rules").dataset.value, start: $("create-start").dataset.value })));
  };

  $("new-invite").onclick = async () => (await ask("Make a new invite link?", "New link")) && attempt(() => api("invite", {}));
  pick($("share"), (on) => attempt(() => api("share", { on: on === "on" })).then(() => state && $("share").set(state.tunnel ? "on" : "off")));
  for (const button of document.querySelectorAll("[data-copy]"))
    button.onclick = async () => {
      await navigator.clipboard.writeText($(button.dataset.copy).textContent);
      button.textContent = "Copied";
      setTimeout(() => (button.textContent = "Copy"), 1500);
    };

  /** The desktop app, a menu entry on computers. The app marks its user agent with SandboxDesktop. */
  function offerApp(link) {
    if (navigator.userAgent.includes("SandboxDesktop") || matchMedia("(pointer: coarse)").matches) return;
    $("app-install").textContent = `curl -fsSL https://raw.githubusercontent.com/theolundqvist/sandbox/master/desktop/install | bash -s -- '${link}'`;
    $("go-app").hidden = false;
  }

  if (!key) {
    for (const b of $("title").querySelectorAll(".item")) b.hidden = true;
    $("waiting").hidden = false;
    show("title");
    setInterval(async () => (await fetch("/api/info")).ok && location.assign("/"), 2000);
  } else {
    offerApp(`${location.origin}/menu#key=${key}`);
    api("state").catch(() => {
      localStorage.removeItem("sandbox-menu");
      location.reload();
    });
    setInterval(() => state?.running && api("state"), 2000);
  }
</script>
</body>
</html>
