<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Sandbox</title>
<style>
  :root {
    --bg: #0b0b0c;
    --ink: #e9e4d8;
    --dim: #8a867d;
    --rule: #26262a;
    --accent: #ffb547;
    --bad: #ff6b5b;
    --bar: 36px;
    font-family: "DIN Alternate", "DIN Condensed", "Bahnschrift", "Barlow Condensed", "Roboto Condensed", "Liberation Sans Narrow", "Arial Narrow", sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; user-select: none; }
  body { background: var(--bg); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

  .drag { -webkit-app-region: drag; }
  .drag button, .drag input { -webkit-app-region: no-drag; }

  #top { height: var(--bar); display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--rule); }
  body.mac #top { padding-left: 84px; }
  body:not(.mac) #top { padding-right: 150px; }
  .mark { width: 12px; height: 12px; background: var(--accent); flex: none; }
  .word { font-size: 13px; letter-spacing: .28em; text-transform: uppercase; font-weight: 700; }
  #world { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #world:not(:empty)::before { content: "/"; margin-right: 14px; color: var(--rule); }
  .spacer { flex: 1; }
  .hint { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  kbd { font: inherit; font-size: 10px; letter-spacing: .08em; color: var(--ink); border: 1px solid #3a3a3f; padding: 1px 5px; margin-right: 6px; }
  #leave { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; padding: 0 12px; height: var(--bar); color: var(--ink); }
  #leave:hover, #leave:focus-visible { background: var(--accent); color: var(--bg); outline: none; }
  body:not(.playing) :is(#leave, #world, #bar-hint) { display: none; }
  body.playing main, body.playing footer { display: none; }

  main { position: absolute; inset: var(--bar) 0 56px 0; display: grid; grid-template-columns: minmax(420px, 1.1fr) 1fr; gap: 72px; padding: 0 72px; align-items: center; }
  h1 { display: flex; align-items: center; gap: 18px; font-size: 76px; line-height: 1; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; }
  h1 .mark { width: 34px; height: 34px; }
  .tag { margin: 14px 0 48px 52px; font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: var(--dim); }

  nav { display: flex; flex-direction: column; }
  .item { position: relative; display: flex; align-items: baseline; gap: 18px; padding: 12px 0 12px 52px; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--dim); outline: none; }
  .item::before { content: ""; position: absolute; left: 0; top: 50%; width: 28px; height: 3px; background: var(--accent); transform: translateY(-50%) scaleX(0); transform-origin: left; transition: transform .12s ease-out; }
  .item:focus, .item:focus-within, .item:hover { color: var(--ink); }
  .item:focus::before, .item:focus-within::before, .item:hover::before { transform: translateY(-50%) scaleX(1); }
  .item small { font-size: 13px; letter-spacing: .16em; color: var(--dim); font-weight: 400; }
  .join { flex-direction: column; align-items: stretch; gap: 10px; }
  .join::before { top: 27px; }
  #invite { font: inherit; font-size: 15px; letter-spacing: .06em; text-transform: none; font-weight: 400; color: var(--ink); background: none; border: 0; border-bottom: 1px solid #3a3a3f; padding: 6px 0 8px; outline: none; width: 100%; user-select: text; }
  #invite:focus { border-bottom-color: var(--accent); }
  #invite::placeholder { color: #55534e; }
  #error { font-size: 13px; letter-spacing: .08em; text-transform: none; font-weight: 400; color: var(--bad); min-height: 16px; }

  aside { align-self: center; max-width: 560px; }
  aside h2 { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--dim); font-weight: 400; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 24px; width: 100%; padding: 14px 12px; border-bottom: 1px solid var(--rule); outline: none; }
  .row b { font-size: 19px; letter-spacing: .1em; text-transform: uppercase; }
  .row span { font-size: 12px; letter-spacing: .12em; color: var(--dim); }
  .row .when { grid-row: 1 / 3; grid-column: 2; align-self: center; text-transform: uppercase; }
  .row:hover, .row:focus { background: var(--ink); color: var(--bg); }
  .row:hover span, .row:focus span { color: #4a4843; }
  .empty { padding: 16px 0; font-size: 14px; letter-spacing: .06em; color: #55534e; }

  footer { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; gap: 32px; padding: 0 72px; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<div id="top" class="drag">
  <span class="mark"></span><span class="word">Sandbox</span><span id="world"></span>
  <span class="spacer"></span>
  <span class="hint" id="bar-hint"><kbd>F11</kbd>Full screen</span>
  <button id="leave">Leave world</button>
</div>

<main>
  <section>
    <h1><span class="mark"></span>Sandbox</h1>
    <p class="tag">Live multiplayer game builder</p>
    <nav id="nav">
      <label class="item join">
        <span>Join with invite</span>
        <input id="invite" spellcheck="false" autocomplete="off" placeholder="Paste the link your host sent">
        <span id="error"></span>
      </label>
      <button class="item" id="continue" hidden>Continue <small></small></button>
      <button class="item" id="host" hidden>Host a world <small>On this computer</small></button>
      <button class="item" id="quit">Quit</button>
    </nav>
  </section>
  <aside>
    <h2>Recent worlds</h2>
    <div id="recents"></div>
  </aside>
</main>

<footer>
  <span class="hint"><kbd>↑</kbd><kbd>↓</kbd>Select</span>
  <span class="hint"><kbd>Enter</kbd>Open</span>
  <span class="hint"><kbd>F11</kbd>Full screen</span>
  <span class="hint" id="reload-hint"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>R</kbd>Reload</span>
</footer>

<script>
  const $ = (id) => document.getElementById(id);
  const invite = $("invite");
  document.body.classList.toggle("mac", shell.platform === "darwin");
  if (shell.platform === "darwin") {
    $("bar-hint").innerHTML = "<kbd>Ctrl</kbd><kbd>⌘</kbd><kbd>F</kbd>Full screen";
    $("reload-hint").innerHTML = "<kbd>⌘</kbd><kbd>R</kbd>Reload";
  }

  const ago = (at) => {
    const m = Math.round((Date.now() - at) / 60000);
    return m < 1 ? "Just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
  };

  async function open(url) {
    $("error").textContent = "";
    const error = await shell.open(url);
    if (error) $("error").textContent = error;
  }

  async function refresh() {
    const s = await shell.state();
    if (s.copied && !invite.value) invite.value = s.copied;
    const last = s.recents[0];
    $("continue").hidden = !last;
    if (last) {
      $("continue").querySelector("small").textContent = last.name;
      $("continue").onclick = () => open(last.url);
    }
    $("host").hidden = !s.local;
    $("host").onclick = () => open(s.local);
    $("recents").replaceChildren(
      ...s.recents.map((r) => {
        const row = document.createElement("button");
        row.className = "row";
        row.innerHTML = "<b></b><span class=when></span><span></span>";
        row.children[0].textContent = r.name;
        row.children[1].textContent = ago(r.at);
        row.children[2].textContent = r.url.replace(/^https?:\/\//, "");
        row.onclick = () => open(r.url);
        return row;
      }),
    );
    if (!s.recents.length) $("recents").innerHTML = "<p class=empty>Worlds you join show up here.</p>";
  }

  invite.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && invite.value.trim()) open(invite.value.trim());
  });
  $("quit").onclick = () => shell.quit();
  $("leave").onclick = () => shell.leave();

  addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    const items = [invite, ...document.querySelectorAll("nav button:not([hidden]), .row")];
    const at = items.indexOf(document.activeElement);
    items[(at + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
    e.preventDefault();
  });
  addEventListener("focus", () => document.body.classList.contains("playing") || refresh());

  shell.on("mode", (mode) => {
    document.body.classList.toggle("playing", !!mode);
    $("world").textContent = mode?.name ?? "";
    if (!mode) {
      refresh();
      invite.focus();
    }
  });
  shell.on("error", (text) => ($("error").textContent = text));
  refresh();
  invite.focus();
</script>
</body>
</html>
