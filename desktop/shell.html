<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Sandbox</title>
<link rel="stylesheet" href="/front.css">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #101113; color: var(--text); font: 15px/1.45 system-ui, sans-serif; overflow: hidden; user-select: none; }
  #title .logo { margin-bottom: 64px; }
  .front { top: 36px; bottom: 96px; padding-top: 60px; padding-bottom: 0; }
  .status { margin: 0; color: var(--dim); font: 700 14px/1.4 var(--display); letter-spacing: .16em; text-transform: uppercase; }
  #down .lead { margin: -16px 0 32px; }
  .hints span { white-space: nowrap; }
  @media (max-width: 1000px), (max-height: 640px) {
    .front { bottom: 64px; padding: 28px 48px 0; }
    .screen > h1 { font-size: 40px; margin-bottom: 20px; }
    #title .logo { height: 44px; margin-bottom: 32px; }
    .item { font-size: 26px; }
    .hints { left: 48px; bottom: 22px; }
    #fullscreen-hint, #reload-hint { display: none; }
  }

  /* The title bar: drags the window, and while in a game names it and offers the way out. */
  #top { position: fixed; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; gap: 14px; padding: 0 16px; -webkit-app-region: drag; font: 700 12px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  #top button { -webkit-app-region: no-drag; }
  body.mac #top { padding-left: 84px; }
  body:not(.mac) #top { padding-right: 150px; }
  body.playing #top { background: #0b0b0c; border-bottom: 1px solid var(--line); }
  #world { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #top .spacer { flex: 1; }
  #top kbd { font: inherit; font-size: 10px; border: 1px solid rgba(255,255,255,.35); padding: 2px 5px; margin-right: 6px; color: var(--text); }
  #leave { height: 36px; padding: 0 12px; background: none; border: 0; color: var(--text); font: inherit; letter-spacing: inherit; text-transform: uppercase; cursor: pointer; outline: none; }
  #leave:hover, #leave:focus-visible { background: var(--accent); color: #0b0b0c; }
  body:not(.playing) :is(#world, #bar-hint, #leave) { display: none; }
  body.playing :is(.backdrop, .front, .hints) { display: none; }
  body.starting :is(#title .items, .hints) { visibility: hidden; }
</style>
</head>
<body>
<div id="backdrop" class="backdrop"></div>
<div id="top">
  <span id="world"></span>
  <span class="spacer"></span>
  <span id="bar-hint"><kbd>F11</kbd>Full screen</span>
  <button id="leave">Leave game</button>
</div>

<main class="front">
  <button class="back" id="back" hidden>Back<kbd>Esc</kbd></button>
  <section id="title" class="screen" data-nav hidden>
    <svg class="logo" id="logo"></svg>
    <div class="items">
      <button class="item" data-to="saved">Worlds</button>
      <button class="item" data-to="join">Join game</button>
      <button class="item" id="go-new">Host game</button>
      <button class="item" id="go-update" hidden>Update<span class="value" id="update-version"></span></button>
      <button class="item" id="quit">Quit</button>
    </div>
  </section>

  <section id="saved" class="screen" data-nav hidden>
    <h1>Worlds</h1>
    <div class="items" id="games"></div>
    <p id="no-games" class="status" hidden>Worlds you host or join show up here</p>
  </section>

  <section id="game" class="screen" data-nav hidden>
    <h1 id="game-name"></h1>
    <div class="items">
      <button class="item" id="game-continue">Continue</button>
      <button class="item danger" id="game-forget">Forget</button>
    </div>
  </section>

  <section id="join" class="screen" data-nav hidden>
    <h1>Join game</h1>
    <label class="item entry"><input type="text" id="join-link" placeholder="Code or invite link" autocomplete="off" spellcheck="false"></label>
  </section>

  <section id="down" class="screen" data-nav hidden>
    <h1>Can't reach</h1>
    <p class="lead" id="down-text"></p>
    <div class="items">
      <button class="item" id="retry">Retry</button>
      <button class="item" data-to="saved">Worlds</button>
      <button class="item" data-to="join">Join game</button>
    </div>
  </section>

  <p id="busy" class="status" hidden></p>
  <div id="error" class="error"></div>
</main>
<div class="hints"><span><kbd>↑↓</kbd>Select</span><span><kbd>Enter</kbd>Open</span><span><kbd>Esc</kbd>Back</span><span id="fullscreen-hint"><kbd>F11</kbd>Full screen</span><span id="reload-hint"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>R</kbd>Reload</span></div>

<script type="module">
  import { backdrop, joinEntry, joinLink, joinable, logo } from "/front.js";
  const $ = (id) => document.getElementById(id);
  backdrop($("backdrop"));
  logo($("logo"));
  if (shell.platform === "darwin") {
    document.body.classList.add("mac");
    $("bar-hint").innerHTML = $("fullscreen-hint").innerHTML = "<kbd>Ctrl</kbd><kbd>⌘</kbd><kbd>F</kbd>Full screen";
    $("reload-hint").innerHTML = "<kbd>⌘</kbd><kbd>R</kbd>Reload";
  }

  // ---------- screens: a stack, Esc goes back one ----------
  const stack = [];
  const current = () => stack.at(-1);
  function show(id, { reset = false } = {}) {
    if (reset) stack.length = 0;
    const from = current();
    if (from) from.focus = document.activeElement?.closest(".screen") === $(from.id) ? document.activeElement : null;
    stack.push({ id });
    enter();
  }
  function back() {
    if (stack.length < 2) return;
    stack.pop();
    enter();
  }
  function enter() {
    const { id, focus } = current();
    for (const s of document.querySelectorAll(".screen")) s.hidden = s.id !== id;
    $("error").textContent = "";
    $("back").hidden = stack.length < 2;
    const target = focus?.isConnected && focus.getClientRects().length ? focus : $(id).querySelector(".item:not([hidden]) input, .item:not([hidden])");
    target?.focus();
  }
  addEventListener("keydown", (e) => {
    const typing = document.activeElement?.matches("input[type=text]");
    if (e.key === "Escape" || (e.key === "Backspace" && !typing)) {
      e.preventDefault();
      back();
    }
    if (e.key === "Enter" && typing) {
      e.preventDefault();
      join();
    }
  });
  for (const b of document.querySelectorAll("[data-to]")) b.onclick = () => show(b.dataset.to);
  $("back").onclick = back;

  const ago = (ms) => {
    const m = Math.round((Date.now() - ms) / 60000);
    return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
  };
  const el = (tag, props, ...children) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  };

  async function busy(text, work) {
    $("error").textContent = "";
    $("busy").textContent = text;
    $("busy").hidden = !text;
    const error = await work();
    $("busy").hidden = true;
    if (error) $("error").textContent = error;
  }
  const open = (url) => busy(url.startsWith("local:") ? "Starting your server…" : "", () => shell.open(url));
  $("go-new").onclick = () => open("local:new");

  // ---------- saved games: the ones this computer hosts and the ones joined, most recent first ----------
  let selected = null;
  async function refresh() {
    const s = await shell.state();
    const games = [
      ...s.hosted.map((g) => ({ ...g, value: g.live ? "Live" : ago(g.at), kind: "Hosted", go: () => open(g.url) })),
      ...s.joined.map((g) => ({ ...g, value: ago(g.at), kind: "Joined", go: () => ((selected = g), ($("game-name").textContent = g.name), show("game")) })),
    ].sort((a, b) => (b.live ? Infinity : b.at) - (a.live ? Infinity : a.at));
    const focused = $("games").contains(document.activeElement) ? document.activeElement.dataset.key : null;
    $("games").replaceChildren(
      ...games.map((g) => {
        const b = el("button", { className: "item", textContent: g.name, onclick: g.go }, el("span", { className: g.live ? "value live" : "value", textContent: g.value }), el("span", { className: "value", textContent: g.kind }));
        b.dataset.key = g.url;
        return b;
      }),
    );
    if (focused) $("games").querySelector(`[data-key="${CSS.escape(focused)}"]`)?.focus();
    $("no-games").hidden = !!games.length;
    if (s.copied && !$("join-link").value && joinable(s.copied)) $("join-link").set(s.copied);
    if (current()?.id === "title" && !document.activeElement?.closest("#title")) enter();
  }
  $("game-continue").onclick = () => open(selected.url);
  $("game-forget").onclick = async () => {
    await shell.forget(selected.url);
    back();
    refresh();
  };

  joinEntry($("join-link"));
  async function join() {
    try {
      await open(await joinLink($("join-link").value, "/relay"));
    } catch (e) {
      $("error").textContent = e.message;
    }
  }

  $("quit").onclick = () => shell.quit();
  $("go-update").onclick = () => busy("Downloading…", shell.update);
  shell.on("update", (version) => {
    $("go-update").hidden = !version;
    $("update-version").textContent = version ?? "";
  });
  $("leave").onclick = () => shell.leave();
  $("retry").onclick = () => open($("retry").dataset.url);

  shell.on("mode", (mode) => {
    document.body.classList.toggle("playing", !!mode);
    $("world").textContent = mode?.name ?? "";
    for (const v of document.querySelectorAll("video")) mode ? v.pause() : v.play().catch(() => {});
    if (!mode) {
      show("title", { reset: true });
      refresh();
    }
  });
  shell.on("down", ({ url, host }) => {
    $("down-text").textContent = `${host} isn't answering. Is the game running?`;
    $("retry").dataset.url = url;
    show("title", { reset: true });
    show("down");
  });
  addEventListener("focus", () => document.body.classList.contains("playing") || refresh());
  shell.on("starting", (text) => {
    $("busy").textContent = text ?? "";
    $("busy").hidden = !text;
  });
  document.body.classList.add("starting");
  show("title");
  refresh();
  await shell.ready();
  document.body.classList.remove("starting");
  enter();
</script>
</body>
</html>
